<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breakwater-integrated WECs</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Include jQuery -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  
  <!-- Include DataTables CSS -->
  <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
  
  <!-- Include DataTables JS -->
  <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
  
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden; /* prevent horizontal scroll on desktop */
      overflow-y: auto; /* allow vertical scroll on desktop */
    }
    
    /* Enable scrolling on mobile devices only */
    @media (max-width: 768px) {
      html, body {
        overflow-x: auto; /* Allow horizontal scroll on mobile */
        overflow-y: auto; /* Allow vertical scroll on mobile */
      }
      
      .table-container {
        overflow-x: auto; /* Ensure table can scroll horizontally */
      }
      
      /* Allow table to expand to fit content on mobile */
      #csv-table {
        min-width: auto !important; /* Let table size adjust to content */
        width: auto !important; /* Auto width based on content */
        table-layout: auto !important; /* Auto layout for content-based sizing */
      }
      
      /* Regular columns: adjust width to fit content, allow multi-line for semicolon-separated content */
      #csv-table th:not(:last-child),
      #csv-table td:not(:last-child) {
        white-space: normal; /* Allow line breaks for <br> tags */
        word-wrap: normal; /* Don't break individual words */
        overflow-wrap: normal; /* Don't break individual words */
        width: auto; /* Let width adjust to content */
        min-width: 80px; /* Reasonable minimum */
        vertical-align: middle; /* Center content vertically */
      }
      
      /* Ensure table rows can expand in height */
      #csv-table tr {
        height: auto; /* Allow rows to expand */
      }
      
      #csv-table td {
        height: auto; /* Allow cells to expand vertically */
        line-height: 1.3; /* Better line spacing for multi-line content */
      }
      
      /* Headers can wrap words (but not break words) and are centered */
      #csv-table th:not(:last-child) {
        white-space: normal; /* Allow header text to wrap */
        word-break: keep-all; /* Don't break words in headers */
        overflow-wrap: break-word; /* Only break very long words if absolutely necessary */
        text-align: center; /* Center horizontally */
        vertical-align: middle; /* Center vertically */
      }
      
      /* Keep the relevant papers column with truncation */
      #csv-table th:last-child,
      #csv-table td:last-child {
        width: 200px;
        max-width: 200px;
        min-width: 200px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: middle; /* Center content vertically */
      }
    }
    body {
      background: url("./images/wavesOcean.jpg") no-repeat center center fixed;
      background-size: cover;
      margin-top: 0em; /* To ensure the content is not hidden behind the fixed nav */
      padding-bottom: 100px; /* Add space for footer */
      font-family: Poppins, sans-serif;
      display:flex;
      flex-direction: column;
      padding-top: 4.3em; /* same as the navbar height */
    }

    .content {
      flex: 1;  /* This will make the content grow and push footer to the bottom */
    }
    
    table {
      width: 100%;
      margin: 20px 0;
    }

    .table-container {
      padding-left: 20px;
      padding-right: 20px;
      padding-top: 20px;
      padding-bottom: 40px;
      max-width: 100%;
      margin: 0 auto;
      overflow-x: auto;
    }

    #csv-table {
      border-collapse: collapse;
    }
    #csv-table th,
    #csv-table td {
      padding: 2px;
      border: 1px solid rgb(0, 0, 0);
      text-align: center;
    }
    #csv-table th {
      background-color: #04AA6D;
      color: white;
    }

    /* Search input box */
    .dataTables_filter input {
      background-color: white !important;
      color: rgb(0, 0, 0) !important;
      border: 1px solid rgb(0, 0, 0) !important;
      padding: 5px 8px;
      border-radius: 4px;
    }

    /* Entries dropdown select */
    .dataTables_length select {
      background-color: white !important;
      color: rgb(0, 0, 0) !important;
      border: 1px solid rgb(0, 0, 0) !important;
      padding: 5px 8px;
      border-radius: 4px;
    }

    .dataTables_length label {
      color: rgb(0, 0, 0); /* change to your desired color */
    }

    .dataTables_filter label {
      color: rgb(0, 0, 0) !important;
    }

    /* "Showing ... of ..." info text */
    .dataTables_info {
      color: rgb(0, 0, 0) !important; /* change to your desired color */
    }

    /* Optional: active/hover pagination buttons */
    .dataTables_paginate .paginate_button.current,
    .dataTables_paginate .paginate_button:hover {
      color: rgb(0, 0, 0) !important;  /* active or hover text color */
    }

    /* Pagination buttons (not hovered) */
    .dataTables_wrapper .dataTables_paginate .paginate_button {
      color: rgb(0, 0, 0) !important;
      cursor: pointer; /* optional: keeps pointer cursor */
    }
    /* Disabled pagination buttons text color */
    .dataTables_wrapper .dataTables_paginate .paginate_button.disabled,
    .dataTables_wrapper .dataTables_paginate .paginate_button.paginate_button_disabled {
      color: rgb(63, 63, 63) !important;
      cursor: default !important;
      font-weight: normal !important;
      border: none !important;
      background: transparent !important;
      padding: 0.5em 1em; /* Set consistent padding */
    }

    /* Prevent hover effect on disabled buttons */
    .dataTables_wrapper .dataTables_paginate .paginate_button.disabled:hover,
    .dataTables_wrapper .dataTables_paginate .paginate_button.paginate_button_disabled:hover {
      color: rgb(63, 63, 63) !important;
      background: none !important;
      border: none !important;
      cursor: default !important;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      padding-top: 100px;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgb(0, 0, 0);
    }
    .modal-content {
      background-color: #fff;
      margin: auto;
      padding: 20px;
      border-radius: 10px;
      width: 80%;
      max-width: 500px;
      font-size: 0.95em;
      line-height: 1.5em;
      color: black;
    }
    .close {
      color: #aaa;
      float: right;
      font-size: 1.3em;
      font-weight: bold;
      cursor: pointer;
    }


  </style>
  <style>
    /* Add left and right padding to table cells */
    #csv-table th, #csv-table td {
      padding-left: 4px;
      padding-right: 4px;
      padding-top: 4px;
      padding-bottom: 4px;
    }
    
    /* Fixed width and truncation for the last column (Relevant papers) */
    #csv-table th:last-child,
    #csv-table td:last-child {
      width: 200px;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
    }
    

    
    /* Style links in the relevant papers column */
    #csv-table td:last-child a {
      color: #0066cc;
      text-decoration: underline;
    }
    
    #csv-table td:last-child a:hover {
      color: #004499;
      text-decoration: none;
    }
    
    /* Make table responsive and fit screen width */
    .table-container {
      overflow-x: auto; /* Allow horizontal scroll when needed */
    }
    
    #csv-table {
      width: 100% !important;
      min-width: 800px; /* Ensure table is wide enough to scroll on mobile */
      table-layout: fixed; /* Fixed layout for consistent column widths */
    }
    
    /* Set specific column widths to fit screen */
    #csv-table th,
    #csv-table td {
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    
    /* Only the last column (Relevant papers) should have truncation - already styled above */
    /* All other columns will wrap text naturally */
    
    /* Desktop styles - prevent word breaking and overflow */
    @media (min-width: 769px) {
      #csv-table {
        table-layout: auto !important; /* Auto layout for content-based sizing */
        width: auto !important; /* Let table expand to fit content */
      }
      
      #csv-table th:not(:last-child),
      #csv-table td:not(:last-child) {
        white-space: normal; /* Allow line breaks for <br> tags */
        word-break: keep-all; /* Don't break words */
        overflow-wrap: normal; /* Don't break words */
        hyphens: none; /* No hyphenation */
        width: auto; /* Let width adjust to content */
        min-width: fit-content; /* Ensure cell is wide enough for content */
      }
      
      /* Headers centered on desktop too */
      #csv-table th:not(:last-child) {
        text-align: center;
        vertical-align: middle;
      }
      
      /* Ensure table container can handle wider content */
      .table-container {
        overflow-x: auto; /* Allow horizontal scroll if table gets very wide */
      }
    }
  </style>
</head>
<body>

<div class="table-container">
  <table id="csv-table">
    <thead></thead>
    <tbody></tbody>
  </table>
</div>

<script>
  function processSemicolonSeparatedContent(content) {
    if (!content || content.trim() === '') return '';
    
    // Split content by semicolons
    const items = content.split(';').map(item => item.trim()).filter(item => item);
    
    // If only one item, return as is
    if (items.length <= 1) {
      return content;
    }
    
    // Multiple items: join with line breaks
    return items.join('<br>');
  }

  function processRelevantPapersLinks(content) {
    if (!content || content.trim() === '') return '';
    console.log('Processing links for content:', content);
    
    // Split content by semicolons
    const items = content.split(';').map(item => item.trim()).filter(item => item);
    console.log('Split items:', items);
    
    const result = items.map((item, index) => {
      // Treat every item as a website URL
      let href = item;
      
      // Add https:// protocol if not already present
      if (!href.startsWith('http://') && !href.startsWith('https://')) {
        href = 'https://' + href;
      }
      
      console.log('Creating link for:', item, 'with href:', href);
      
      // Use the simplest possible approach - direct onclick with tooltip
      return '<a href="#" onclick="window.open(\'' + href.replace(/'/g, "\\'") + '\', \'_blank\'); return false;" title="' + href.replace(/"/g, '&quot;') + '" style="color: #0066cc; text-decoration: underline; cursor: pointer;">' + item + '</a>';
    }).join('<br>');
    
    console.log('Final result:', result);
    return result;
  }

  $(document).ready(function() {
    $.ajax({
      url: 'data.csv?t=' + new Date().getTime(),
      dataType: 'text',
    }).done(function(csvData) {
      const parsed = Papa.parse(csvData.trim(), { header: false, delimiter: ";" });
      const rows = parsed.data;
      const headers = rows[0];
      const data = rows.slice(1);

      // Build table header
      let headerHtml = '';
      headers.forEach(header => {
        headerHtml += `<th>${header.trim()}</th>`;
      });
      $('#csv-table thead').html(`<tr>${headerHtml}</tr>`);

      // Build map: data column index → corresponding Ref_ column index
      const refMap = {};
      headers.forEach((header, refIdx) => {
        const match = header.trim().match(/^Ref_(.+)$/);
        if (match) {
          const targetHeader = match[1].trim();
          const dataIdx = headers.findIndex(h => h.trim() === targetHeader);
          if (dataIdx !== -1) {
            refMap[dataIdx] = refIdx;
          }
        }
      });

      const referenceStore = {};
      let refCounter = 1;
      let bodyHtml = '';

      data.forEach((row, rowIndex) => {
        bodyHtml += '<tr>';
        row.forEach((cell, colIndex) => {
          const content = cell.trim();

          if (refMap.hasOwnProperty(colIndex)) {
            const refColIndex = refMap[colIndex];
            const refCell = (row[refColIndex] || "").trim();

            if (refCell) {
              const refId = `ref-${rowIndex}-${colIndex}`;
              referenceStore[refId] = refCell;
              bodyHtml += `<td>${content} <sup><a href="#" onclick="openModal('${refId}'); return false;">[${refCounter++}]</a></sup></td>`;
            } else {
              const processedContent = processSemicolonSeparatedContent(content);
              bodyHtml += `<td>${processedContent}</td>`;
            }

          } else if (!Object.values(refMap).includes(colIndex)) {
            // Not a reference column — check if it's the "Relevant papers" column
            if (colIndex < headers.length && headers[colIndex]) {
              const columnHeader = headers[colIndex].trim();
              console.log('Processing column:', columnHeader, 'at index:', colIndex);
              
              if (columnHeader === 'Relevant papers') {
                // This is the "Relevant papers" column - process links
                console.log('Found Relevant papers column with content:', content);
                const processedContent = processRelevantPapersLinks(content);
                bodyHtml += `<td>${processedContent}</td>`;
              } else {
                // Regular column - process semicolon-separated content
                const processedContent = processSemicolonSeparatedContent(content);
                bodyHtml += `<td>${processedContent}</td>`;
              }
            } else {
              // Column index out of bounds, treat as regular content
              const processedContent = processSemicolonSeparatedContent(content);
              bodyHtml += `<td>${processedContent}</td>`;
            }
          }
        });
        bodyHtml += '</tr>';
      });

      $('#csv-table tbody').html(bodyHtml);

      const extraHiddenCols = [];
      ['Figure', 'Comments', 'Latitude', 'Longitude'].forEach(colName => {
        const idx = headers.findIndex(h => h.trim() === colName);
        if (idx !== -1) extraHiddenCols.push(idx);
      });

      const hiddenCols = [...Object.values(refMap), ...extraHiddenCols];

      // then initialize DataTable with hiddenCols
      $('#csv-table').DataTable({
        pageLength: 10,
        lengthMenu: [5, 10, 25, 50],
        scrollX: false,
        autoWidth: false,
        columnDefs: [
          {
            targets: hiddenCols,
            visible: false
          }
        ]
      });
      
      // Store reference data globally for modal use
      window.referenceMap = referenceStore;

    }).fail(function() {
      console.error("Error loading CSV file.");
    });
  });

  function openModal(refId) {
    const modalText = window.referenceMap?.[refId] || "Reference not found.";
    document.getElementById('modal-text').innerText = modalText;
    document.getElementById('modal').style.display = "block";
  }

  function closeModal() {
    document.getElementById('modal').style.display = "none";
  }

  window.onclick = function(event) {
    const modal = document.getElementById('modal');
    if (event.target === modal) {
      modal.style.display = "none";
    }
  };
</script>

  
<div id="navbar"></div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modal-text"></div>
  </div>
</div>

</body>

</html>
